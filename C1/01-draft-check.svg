<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title description">
  <title id="title">先檢查，再存草稿</title>
  <desc id="description">原稿經檢查，通過才存成草稿；未通過則修正原稿後重新檢查。</desc>
  <rect width="1000" height="700" fill="#ffffff"/>
  <g font-family="Noto Sans CJK TC, sans-serif" fill="#172b40" text-anchor="middle">
    <text x="500" y="72" font-size="44" font-weight="700">先檢查，再存草稿</text>
    <text x="500" y="116" font-size="30">只處理一篇文章，不直接發佈</text>
    <g fill="#f0f5fa" stroke="#60758a" stroke-width="3">
      <rect x="70" y="218" width="210" height="100" rx="12"/>
      <path d="M500 188 L635 268 L500 348 L365 268 Z"/>
      <rect x="720" y="218" width="210" height="100" rx="12"/>
      <rect x="395" y="478" width="210" height="100" rx="12"/>
    </g>
    <g font-size="38">
      <text x="175" y="280">原稿</text>
      <text x="500" y="280">檢查</text>
      <text x="825" y="280">存成草稿</text>
      <text x="500" y="540">修正原稿</text>
    </g>
    <g fill="none" stroke="#3d607d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M280 268 H350 M338 258 L350 268 L338 278"/>
      <path d="M635 268 H705 M693 258 L705 268 L693 278"/>
      <path d="M500 348 V463 M490 451 L500 463 L510 451"/>
      <path d="M395 528 H175 V333 M165 345 L175 333 L185 345"/>
    </g>
    <g font-size="32">
      <text x="675" y="208">通過</text>
      <text x="566" y="418">未通過</text>
      <text x="260" y="578">重新檢查</text>
    </g>
    <text x="500" y="658" font-size="30">草稿仍需人工預覽與確認</text>
  </g>
</svg>
