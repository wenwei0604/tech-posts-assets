name: check-paths
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only allow article image paths
        run: |
          bad=$(git ls-files | grep -vE '^(README\.md|\.github/workflows/check-paths\.yml|\.gitignore|([A-H][0-9]+|M[0-9]+[a-z]?)/[0-9]{2}-[a-z0-9-]+\.(png|svg|jpg|webp))$' || true)
          if [ -n "$bad" ]; then echo "Unexpected files:"; echo "$bad"; exit 1; fi
